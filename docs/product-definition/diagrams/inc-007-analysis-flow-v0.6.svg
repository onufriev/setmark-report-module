<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250">
  <style>
    .title{font:700 46px Arial;fill:#0b2f6b}.subtitle{font:28px Arial;fill:#324e73}.box{fill:#fff;stroke:#1e5bb8;stroke-width:3}.decision{fill:#fff;stroke:#1e5bb8;stroke-width:3}.ok{fill:#f1fbf5;stroke:#24884d;stroke-width:3}.warn{fill:#fff8ed;stroke:#d47a13;stroke-width:3}.action{fill:#f4f8ff;stroke:#1e5bb8;stroke-width:3}.unknown{fill:#f7f7f7;stroke:#777;stroke-width:3}.txt{font:23px Arial;fill:#12223a}.bold{font:700 23px Arial;fill:#12223a}.small{font:19px Arial;fill:#12223a}.label{font:700 21px Arial;fill:#0b2f6b}.arrow{stroke:#1e5bb8;stroke-width:4;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1e5bb8"/></marker></defs>

  <text x="700" y="65" text-anchor="middle" class="title">Алгоритм разбора INC-007</text>
  <text x="700" y="108" text-anchor="middle" class="subtitle">Продажа товара, заблокированного по решению ОГВ</text>

  <rect x="310" y="150" width="780" height="105" rx="18" class="box"/>
  <text x="700" y="192" text-anchor="middle" class="bold">Получено отклонение INC-007 после продажи</text>
  <text x="700" y="228" text-anchor="middle" class="txt">Определяем состояние исторического результата проверки</text>
  <path d="M700 255 L700 315" class="arrow"/>

  <polygon points="700,315 1020,410 700,505 380,410" class="decision"/>
  <text x="700" y="395" text-anchor="middle" class="bold">Какое состояние результата проверки?</text>

  <path d="M380 410 L205 410 L205 570" class="arrow"/>
  <text x="215" y="385" class="label">Просто не найден</text>
  <rect x="25" y="570" width="420" height="215" rx="18" class="unknown"/>
  <text x="235" y="618" text-anchor="middle" class="bold">Недостаточно данных, RA-04</text>
  <text x="235" y="662" text-anchor="middle" class="txt">Получить кассовые логи</text>
  <text x="235" y="700" text-anchor="middle" class="txt">и сохранённые ответы каналов</text>
  <text x="235" y="748" text-anchor="middle" class="txt">Не считать отсутствием проверки</text>

  <path d="M1020 410 L1195 410 L1195 570" class="arrow"/>
  <text x="1035" y="385" class="label">Отсутствие доказано</text>
  <rect x="955" y="570" width="420" height="215" rx="18" class="action"/>
  <text x="1165" y="618" text-anchor="middle" class="bold">Продажа без результата, RA-01</text>
  <text x="1165" y="662" text-anchor="middle" class="txt">Применить единую ветку:</text>
  <text x="1165" y="700" text-anchor="middle" class="txt">валидация группы → продажа</text>
  <text x="1165" y="738" text-anchor="middle" class="txt">без ответа → CSI</text>

  <path d="M700 505 L700 600" class="arrow"/>
  <text x="720" y="550" class="label">Результат сохранён</text>
  <polygon points="700,600 960,685 700,770 440,685" class="decision"/>
  <text x="700" y="672" text-anchor="middle" class="bold">isBlocked = true?</text>

  <path d="M620 744 L620 810 L360 810 L360 855" class="arrow"/>
  <text x="500" y="802" class="label">Да</text>
  <rect x="80" y="855" width="560" height="275" rx="18" class="ok"/>
  <text x="360" y="905" text-anchor="middle" class="bold">Подтверждённое нарушение, RA-01</text>
  <text x="360" y="950" text-anchor="middle" class="txt">Установить</text>
  <text x="360" y="988" text-anchor="middle" class="txt">ignoreTrueApiMarkIsBlocked = false</text>
  <text x="360" y="1033" text-anchor="middle" class="txt">Если уже false — обратиться в CSI</text>
  <text x="360" y="1080" text-anchor="middle" class="bold">Источник запрета уточнить по ogvs</text>

  <path d="M780 744 L780 810 L1040 810 L1040 855" class="arrow"/>
  <text x="880" y="802" class="label">Нет</text>
  <rect x="760" y="855" width="560" height="275" rx="18" class="warn"/>
  <text x="1040" y="905" text-anchor="middle" class="bold">Противоречие данных, RA-04</text>
  <text x="1040" y="950" text-anchor="middle" class="txt">Касса получила isBlocked = false</text>
  <text x="1040" y="995" text-anchor="middle" class="txt">Передать в Честный Знак отклонение,</text>
  <text x="1040" y="1033" text-anchor="middle" class="txt">чек, КМ и полный сохранённый ответ</text>
  <text x="1040" y="1080" text-anchor="middle" class="bold">ogvs в этой ветке не используется</text>

  <text x="700" y="1210" text-anchor="middle" class="small">Массив ogvs определяет источник запрета только при isBlocked = true.</text>
</svg>
