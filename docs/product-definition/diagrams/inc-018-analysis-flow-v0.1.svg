<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1280" viewBox="0 0 1300 1280">
  <style>
    .title{font:700 44px Arial;fill:#0b2f6b}.subtitle{font:27px Arial;fill:#324e73}.box{fill:#fff;stroke:#1e5bb8;stroke-width:3}.decision{fill:#fff;stroke:#1e5bb8;stroke-width:3}.action{fill:#f4f8ff;stroke:#1e5bb8;stroke-width:3}.ok{fill:#f1fbf5;stroke:#24884d;stroke-width:3}.warn{fill:#fff8ed;stroke:#d47a13;stroke-width:3}.txt{font:22px Arial;fill:#12223a}.bold{font:700 22px Arial;fill:#12223a}.small{font:19px Arial;fill:#12223a}.label{font:700 20px Arial;fill:#0b2f6b}.arrow{stroke:#1e5bb8;stroke-width:4;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1e5bb8"/></marker></defs>
  <text x="650" y="60" text-anchor="middle" class="title">Алгоритм разбора INC-018</text>
  <text x="650" y="102" text-anchor="middle" class="subtitle">Продажа кода групповой упаковки после выбытия</text>
  <rect x="270" y="145" width="760" height="95" rx="18" class="box"/>
  <text x="650" y="202" text-anchor="middle" class="bold">Сопоставить отклонение с продажами группового кода в SMC</text>
  <path d="M650 240 L650 305" class="arrow"/>
  <polygon points="650,305 960,395 650,485 340,395" class="decision"/>
  <text x="650" y="385" text-anchor="middle" class="bold">Сколько продаж группового кода найдено?</text>

  <path d="M340 395 L180 395 L180 575" class="arrow"/>
  <text x="205" y="370" class="label">Две и более</text>
  <rect x="25" y="575" width="420" height="190" rx="18" class="action"/>
  <text x="235" y="625" text-anchor="middle" class="bold">Обычный повтор продажи</text>
  <text x="235" y="670" text-anchor="middle" class="txt">Применить INC-001</text>
  <text x="235" y="715" text-anchor="middle" class="txt">и проверить возврат</text>

  <path d="M960 395 L1120 395 L1120 540" class="arrow"/>
  <text x="995" y="370" class="label">Одна</text>
  <polygon points="1000,540 1250,620 1000,700 750,620" class="decision"/>
  <text x="1000" y="610" text-anchor="middle" class="bold">Состав упаковки есть в SMC?</text>

  <path d="M750 620 L560 620 L560 800 L265 800" class="arrow"/>
  <text x="650" y="595" class="label">Нет</text>
  <rect x="30" y="800" width="470" height="220" rx="18" class="warn"/>
  <text x="265" y="850" text-anchor="middle" class="bold">RA-04 — данных недостаточно</text>
  <text x="265" y="895" text-anchor="middle" class="txt">Загрузить упаковки с входящими КМ</text>
  <text x="265" y="937" text-anchor="middle" class="txt">и установить предыдущее выбытие</text>
  <text x="265" y="979" text-anchor="middle" class="txt">по данным Честного Знака</text>

  <path d="M1000 700 L1000 790" class="arrow"/>
  <text x="1020" y="755" class="label">Да</text>
  <polygon points="1000,790 1250,870 1000,950 750,870" class="decision"/>
  <text x="1000" y="858" text-anchor="middle" class="bold">Ранее продан входящий КМ?</text>

  <path d="M750 870 L650 870 L650 1040" class="arrow"/>
  <text x="700" y="845" class="label">Да</text>
  <path d="M1250 870 L1270 870 L1270 1040 L1080 1040" class="arrow"/>
  <text x="1210" y="845" class="label">Нет</text>
  <rect x="900" y="1040" width="365" height="145" rx="18" class="warn"/>
  <text x="1082" y="1090" text-anchor="middle" class="bold">RA-04 — противоречие</text>
  <text x="1082" y="1135" text-anchor="middle" class="txt">Обратиться в Честный Знак</text>

  <rect x="430" y="1040" width="440" height="185" rx="18" class="ok"/>
  <text x="650" y="1090" text-anchor="middle" class="bold">RA-01 — упаковка расформирована</text>
  <text x="650" y="1135" text-anchor="middle" class="txt">Не продавать групповой код</text>
  <text x="650" y="1177" text-anchor="middle" class="txt">после продажи входящего КМ</text>
  <text x="650" y="1260" text-anchor="middle" class="small">Одна продажа группового кода не исключает более раннюю продажу входящего КМ.</text>
</svg>
