<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1650" viewBox="0 0 1400 1650">
  <style>
    .title{font:700 44px Arial;fill:#0b2f6b}.subtitle{font:27px Arial;fill:#324e73}.box{fill:#fff;stroke:#1e5bb8;stroke-width:3}.decision{fill:#fff;stroke:#1e5bb8;stroke-width:3}.action{fill:#f4f8ff;stroke:#1e5bb8;stroke-width:3}.ok{fill:#f1fbf5;stroke:#24884d;stroke-width:3}.warn{fill:#fff8ed;stroke:#d47a13;stroke-width:3}.unknown{fill:#f7f7f7;stroke:#777;stroke-width:3}.txt{font:22px Arial;fill:#12223a}.bold{font:700 22px Arial;fill:#12223a}.small{font:19px Arial;fill:#12223a}.label{font:700 20px Arial;fill:#0b2f6b}.arrow{stroke:#1e5bb8;stroke-width:4;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1e5bb8"/></marker></defs>
  <text x="700" y="60" text-anchor="middle" class="title">Алгоритм разбора INC-017</text>
  <text x="700" y="102" text-anchor="middle" class="subtitle">Продажа товара, недоступного для реализации</text>
  <rect x="315" y="145" width="770" height="95" rx="18" class="box"/>
  <text x="700" y="202" text-anchor="middle" class="bold">Получено отклонение после завершённой продажи</text>
  <path d="M700 240 L700 305" class="arrow"/>
  <polygon points="700,305 990,390 700,475 410,390" class="decision"/>
  <text x="700" y="380" text-anchor="middle" class="bold">Результат проверки сохранён?</text>

  <path d="M410 390 L205 390 L205 555" class="arrow"/>
  <text x="300" y="365" class="label">Просто не найден</text>
  <rect x="30" y="555" width="420" height="205" rx="18" class="unknown"/>
  <text x="240" y="605" text-anchor="middle" class="bold">RA-04 — недостаточно данных</text>
  <text x="240" y="650" text-anchor="middle" class="txt">Получить логи и ответы каналов</text>
  <text x="240" y="695" text-anchor="middle" class="txt">Не считать отсутствием проверки</text>

  <path d="M990 390 L1195 390 L1195 555" class="arrow"/>
  <text x="1010" y="365" class="label">Отсутствие доказано</text>
  <rect x="950" y="555" width="420" height="205" rx="18" class="action"/>
  <text x="1160" y="605" text-anchor="middle" class="bold">RA-01 — без результата</text>
  <text x="1160" y="650" text-anchor="middle" class="txt">Валидация группы → продажа</text>
  <text x="1160" y="695" text-anchor="middle" class="txt">без ответа → CSI</text>

  <path d="M700 475 L700 550" class="arrow"/>
  <text x="720" y="525" class="label">Да</text>
  <polygon points="700,550 930,630 700,710 470,630" class="decision"/>
  <text x="700" y="620" text-anchor="middle" class="bold">sold = true?</text>

  <path d="M620 682 L620 770 L345 770 L345 820" class="arrow"/>
  <text x="490" y="760" class="label">Да</text>
  <rect x="80" y="820" width="530" height="180" rx="18" class="action"/>
  <text x="345" y="872" text-anchor="middle" class="bold">Приоритет повторной продажи</text>
  <text x="345" y="918" text-anchor="middle" class="txt">Применить INC-001</text>
  <text x="345" y="960" text-anchor="middle" class="txt">realizable не анализировать</text>

  <path d="M780 682 L780 760 L1055 760" class="arrow"/>
  <text x="900" y="740" class="label">Нет</text>
  <polygon points="1055,760 1325,835 1055,910 785,835" class="decision"/>
  <text x="1055" y="825" text-anchor="middle" class="bold">Табак и grayZone = true?</text>

  <path d="M1325 835 L1370 835 L1370 950 L1180 950 L1180 1000" class="arrow"/>
  <text x="1300" y="810" class="label">Да</text>
  <rect x="1010" y="1000" width="340" height="180" rx="18" class="ok"/>
  <text x="1180" y="1050" text-anchor="middle" class="bold">RA-02 — допустимо</text>
  <text x="1180" y="1095" text-anchor="middle" class="txt">Серая зона разрешает</text>
  <text x="1180" y="1137" text-anchor="middle" class="txt">продажу при realizable=false</text>

  <path d="M1055 910 L1055 970 L700 970 L700 1010" class="arrow"/>
  <text x="1030" y="950" class="label">Нет</text>
  <polygon points="700,1010 970,1090 700,1170 430,1090" class="decision"/>
  <text x="700" y="1080" text-anchor="middle" class="bold">realizable = false?</text>

  <path d="M550 1145 L550 1260" class="arrow"/>
  <text x="520" y="1215" class="label">Да</text>
  <rect x="100" y="1260" width="540" height="190" rx="18" class="warn"/>
  <text x="370" y="1310" text-anchor="middle" class="bold">RA-01 — подтверждённое нарушение</text>
  <text x="370" y="1355" text-anchor="middle" class="txt">Проверить ignoreTrueApiMarkRealizable</text>
  <text x="370" y="1400" text-anchor="middle" class="txt">Если уже false — обратиться в CSI</text>

  <path d="M850 1145 L850 1215 L1100 1215 L1100 1260" class="arrow"/>
  <text x="870" y="1200" class="label">Нет</text>
  <rect x="820" y="1260" width="500" height="190" rx="18" class="warn"/>
  <text x="1070" y="1310" text-anchor="middle" class="bold">RA-04 — противоречие</text>
  <text x="1070" y="1355" text-anchor="middle" class="txt">Передать полный ответ</text>
  <text x="1070" y="1400" text-anchor="middle" class="txt">в Честный Знак</text>
  <text x="700" y="1600" text-anchor="middle" class="small">Порядок признаков: sold → табачное исключение grayZone → realizable.</text>
</svg>
