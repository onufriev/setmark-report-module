<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Mark — Мониторинг нарушений</title>
  <link rel="stylesheet" href="../prototype-kit/csi_ui-prototype-kit/csi-ui.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">К основному содержимому</a>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">S</span><span>Set Mark</span></div>
    <label class="network-switch-wrap">
      <span class="sr-only">Выбор сети</span>
      <select class="network-switch" data-network aria-label="Выбор сети">
        <option value="north">Сеть «Север»</option>
        <option value="center">Сеть «Центр»</option>
        <option value="south">Сеть «Юг»</option>
      </select>
    </label>
    <div class="topbar-spacer"></div>
    <button class="icon-button" type="button" aria-label="Уведомления"><span aria-hidden="true">◔</span><b>3</b></button>
    <button class="user-button" type="button" aria-label="Профиль пользователя">АИ</button>
  </header>

  <div class="shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <nav>
        <a href="#overview" data-nav="overview"><span>▦</span>Обзор</a>
        <a href="#incidents" data-nav="incidents"><span>≡</span>Инциденты <b>64</b></a>
        <a href="#analytics" data-nav="analytics"><span>⌁</span>Аналитика</a>
        <a href="#settings" data-nav="settings"><span>⚙</span>Настройки</a>
      </nav>
      <div class="sidebar-foot">
        <span class="source-dot ok"></span>
        <div><strong>Данные актуальны</strong><small>сегодня, 18:40</small></div>
      </div>
    </aside>

    <main id="main" tabindex="-1">
      <section id="overview-view" class="view"></section>
      <section id="incidents-view" class="view" hidden></section>
      <section id="incident-view" class="view" hidden></section>
      <section id="analytics-view" class="view" hidden></section>
      <section id="settings-view" class="view" hidden></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <nav hidden aria-hidden="true">
    <a href="#priority">Критические инциденты</a>
    <a href="#incident/INC-10482">Карточка демонстрационного инцидента</a>
  </nav>
  <script src="app.js"></script>
</body>
</html>
