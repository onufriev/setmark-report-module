name: Publish Visual Prototype

on:
  push:
    branches:
      - agent/resolve-visual-prototype-gate
    paths:
      - 'visual-prototype/app/**'
      - '.github/workflows/publish-visual-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: visual-prototype/app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
