name: Approve VISUAL_PROTOTYPE R4

on:
  push:
    branches:
      - agent/resolve-visual-prototype-gate
    paths:
      - '.github/workflows/approve-visual-prototype-r4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  approve-r4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Product Compiler dependencies
        run: python -m pip install -r requirements-tooling.txt

      - name: Refresh branch before approval
        shell: bash
        run: |
          git pull --ff-only origin agent/resolve-visual-prototype-gate || true

      - name: Present R4 to Product Manager
        run: python tools/present_phase_review.py --phase VISUAL_PROTOTYPE --review-id VISUAL_PROTOTYPE-R4

      - name: Mark R4 as shown
        run: python tools/mark_phase_review_shown.py --phase VISUAL_PROTOTYPE --review-id VISUAL_PROTOTYPE-R4

      - name: Approve R4 with exact Product Manager message
        run: >-
          python tools/approve_phase_review.py
          --phase VISUAL_PROTOTYPE
          --review-id VISUAL_PROTOTYPE-R4
          --decision APPROVED
          --message "все хорошо, давай зафиксируем результат"

      - name: Commit approval lifecycle state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/phase-reviews.json
          git commit -m "chore: approve VISUAL_PROTOTYPE R4"
          # Derived JSON is regenerated by Product Compiler after the approval commit.
          git reset --hard HEAD
          git pull --rebase origin agent/resolve-visual-prototype-gate
          git push origin HEAD:agent/resolve-visual-prototype-gate
