name: Render Confluence screenshots

on:
  push:
    paths:
      - '.github/workflows/render-confluence-screens.yml'
      - 'visual-prototype/app/**'
      - 'docs/confluence-assets/incident-maps/source/**'
      - 'docs/product-definition/diagrams/**'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local servers
        run: |
          python3 -m http.server 8080 --directory visual-prototype/app >/tmp/setmark-http.log 2>&1 &
          python3 -m http.server 8081 --directory . >/tmp/assets-http.log 2>&1 &
          for port in 8080 8081; do
            ok=0
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:${port}/ >/dev/null; then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then
              cat /tmp/setmark-http.log || true
              cat /tmp/assets-http.log || true
              exit 1
            fi
          done

      - name: Capture screens and incident maps
        run: |
          mkdir -p docs/confluence-assets/screens docs/confluence-assets/incident-maps
          cp docs/product-definition/diagrams/inc-003-analysis-flow-v0.4.png docs/confluence-assets/incident-maps/inc-003.png
          cp docs/product-definition/diagrams/inc-004-analysis-flow-v0.2.png docs/confluence-assets/incident-maps/inc-004.png
          cp docs/product-definition/diagrams/inc-005-analysis-flow-v0.1.png docs/confluence-assets/incident-maps/inc-005.png
          cp docs/product-definition/diagrams/inc-007-analysis-flow-v0.4.png docs/confluence-assets/incident-maps/inc-007.png
          cp docs/product-definition/diagrams/inc-008-analysis-flow-v0.4.png docs/confluence-assets/incident-maps/inc-008.png

          cat > capture-confluence.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});

          const page = await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
          const screens = [
            ['dashboard','overview'],
            ['incidents','incidents'],
            ['incident-card','incident/INC-10621'],
            ['actions','actions'],
            ['analytics','analytics'],
            ['settings','settings']
          ];
          for (const [name,hash] of screens) {
            await page.goto(`http://127.0.0.1:8080/#${hash}`, {waitUntil:'networkidle'});
            await page.waitForTimeout(500);
            await page.screenshot({path:`docs/confluence-assets/screens/${name}.png`,fullPage:true});
          }
          await page.close();

          const mapPage = await browser.newPage({viewport:{width:1280,height:900},deviceScaleFactor:1});
          for (const name of ['inc-001','inc-002']) {
            await mapPage.goto(`http://127.0.0.1:8081/docs/confluence-assets/incident-maps/source/${name}.html`, {waitUntil:'networkidle'});
            await mapPage.waitForTimeout(300);
            await mapPage.screenshot({path:`docs/confluence-assets/incident-maps/${name}.png`,fullPage:true});
          }

          await mapPage.goto('http://127.0.0.1:8081/docs/product-definition/diagrams/inc-006-analysis-flow-v0.1.svg', {waitUntil:'networkidle'});
          await mapPage.waitForTimeout(300);
          await mapPage.screenshot({path:'docs/confluence-assets/incident-maps/inc-006.png',fullPage:true});
          await mapPage.close();
          await browser.close();
          EOF
          node capture-confluence.mjs
          rm capture-confluence.mjs

      - name: Commit rendered assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/confluence-assets/screens docs/confluence-assets/incident-maps
          if git diff --cached --quiet; then
            echo 'Rendered assets unchanged'
          else
            git commit -m 'docs: refresh Confluence rendered assets'
            git push origin HEAD:${{ github.ref_name }}
          fi
