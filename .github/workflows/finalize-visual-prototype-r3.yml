name: Finalize VISUAL_PROTOTYPE R3

on:
  push:
    branches:
      - agent/resolve-visual-prototype-gate
    paths:
      - 'reports/visual-prototype-v0.3.md'
      - '.github/workflows/finalize-visual-prototype-r3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-r3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Product Compiler dependencies
        run: python -m pip install -r requirements-tooling.txt

      - name: Validate corrected visual prototype
        run: python tools/validate_visual_prototype.py --phase VISUAL_PROTOTYPE

      - name: Mark R2 stale after Product Manager regression feedback
        shell: bash
        run: |
          python - <<'PY'
          from common import load, mark_phase_reviews_stale, run_tool

          doc = load('product/phase-reviews.json')
          if any(item.get('reviewId') == 'VISUAL_PROTOTYPE-R3' for item in doc.get('reviews', [])):
              print('R3 already exists; skip reopening')
          else:
              changed = mark_phase_reviews_stale(
                  'VISUAL_PROTOTYPE',
                  'Замечания Product Manager: при сравнении с предыдущей версией обнаружены функциональные регрессии визуального прототипа — пропали фильтры Аналитики, блоки «Объекты с наибольшим риском» и «Состояние данных». Полное сравнение выявило дополнительные потери переходов и функций; для R3 они восстановлены и validator усилен.'
              )
              print('Marked stale:', ', '.join(changed) if changed else 'none')
              run_tool('sync_workspace.py')
          PY

      - name: Register fresh artifact evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, 'tools')
          from common import ROOT, artifact_sha256

          artifact = (ROOT / 'visual-prototype').resolve()
          current_sha = artifact_sha256(artifact)
          evidence = json.loads(Path('product/artifact-evidence.json').read_text(encoding='utf-8'))
          matching = [
              item for item in evidence.get('evidence', [])
              if item.get('phase') == 'VISUAL_PROTOTYPE'
              and item.get('artifactPath') == 'visual-prototype'
              and item.get('result') == 'PASSED'
              and item.get('sha256') == current_sha
          ]
          if matching:
              print(f"Current corrected prototype already verified by {matching[-1].get('id')}")
          else:
              subprocess.run([
                  'python', 'tools/register_artifact_evidence.py',
                  '--phase', 'VISUAL_PROTOTYPE',
                  '--path', 'visual-prototype',
                  '--type', 'visual-prototype',
                  '--check', 'Дашборд содержит объекты риска и ровно два согласованных сигнала состояния данных',
                  '--check', 'Аналитика содержит два фильтра, четыре показателя и кликабельные дневные/недельные колонки',
                  '--check', 'Поиск, множественный фильтр магазинов и CSV из 21 поля сохранены',
                  '--check', 'Потенциальный штраф сохранён в UI и защищён от двойного учёта нормативной группы',
                  '--check', 'Настройки уведомлений и хранения восстановлены; PDF конкретного инцидента имеет рабочий сценарий',
                  '--result', 'PASSED',
                  '--command', 'python tools/validate_visual_prototype.py --phase VISUAL_PROTOTYPE',
                  '--runbook', 'visual-prototype/PROTOTYPE-RUNBOOK.md',
              ], check=True)
          PY

      - name: Synchronize workspace
        run: python tools/sync_workspace.py --strict-json --verbose

      - name: Finalize VISUAL_PROTOTYPE R3
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          reviews = json.loads(Path('product/phase-reviews.json').read_text(encoding='utf-8'))
          if any(item.get('reviewId') == 'VISUAL_PROTOTYPE-R3' for item in reviews.get('reviews', [])):
              print('VISUAL_PROTOTYPE-R3 already registered')
          else:
              subprocess.run([
                  'python', 'tools/finalize_phase_review.py',
                  '--phase', 'VISUAL_PROTOTYPE',
                  '--markdown', 'reports/visual-prototype-v0.3.md',
              ], check=True)
          PY

      - name: Verify R3 PDF renders
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdfinfo reports/visual-prototype-v0.3.pdf >/dev/null
          pdftoppm -f 1 -singlefile -png reports/visual-prototype-v0.3.pdf /tmp/visual-prototype-r3 >/dev/null
          test -s /tmp/visual-prototype-r3.png

      - name: Commit R3 lifecycle state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/*.json project-state.json visual-prototype/prototype-manifest.json reports/visual-prototype-v0.3.pdf
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: register VISUAL_PROTOTYPE R3"
          git push
