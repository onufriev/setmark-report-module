name: Finalize VISUAL_PROTOTYPE R4

on:
  push:
    branches:
      - agent/resolve-visual-prototype-gate
    paths:
      - 'reports/visual-prototype-v0.4.md'
      - '.github/workflows/finalize-visual-prototype-r4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-r4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Product Compiler dependencies
        run: python -m pip install -r requirements-tooling.txt

      - name: Validate visual prototype
        run: python tools/validate_visual_prototype.py --phase VISUAL_PROTOTYPE

      - name: Mark R3 stale after Product Manager feedback
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from common import load, mark_phase_reviews_stale, run_tool

          doc = load('product/phase-reviews.json')
          if any(item.get('reviewId') == 'VISUAL_PROTOTYPE-R4' for item in doc.get('reviews', [])):
              print('R4 already exists; skip stale transition')
          else:
              changed = mark_phase_reviews_stale(
                  'VISUAL_PROTOTYPE',
                  'Замечание Product Manager: удалить неподтверждённый селектор торговой сети «Сеть „Север“», поскольку мультисетевой режим не входит в согласованный MVP.'
              )
              print('Marked stale:', ', '.join(changed) if changed else 'none')
              run_tool('sync_workspace.py')
          PY

      - name: Finalize VISUAL_PROTOTYPE R4
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          reviews = json.loads(Path('product/phase-reviews.json').read_text(encoding='utf-8'))
          if any(item.get('reviewId') == 'VISUAL_PROTOTYPE-R4' for item in reviews.get('reviews', [])):
              print('VISUAL_PROTOTYPE-R4 already registered')
          else:
              subprocess.run([
                  'python', 'tools/finalize_phase_review.py',
                  '--phase', 'VISUAL_PROTOTYPE',
                  '--markdown', 'reports/visual-prototype-v0.4.md',
              ], check=True)
          PY

      - name: Verify R4 PDF renders
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdfinfo reports/visual-prototype-v0.4.pdf >/dev/null
          pdftoppm -f 1 -singlefile -png reports/visual-prototype-v0.4.pdf /tmp/visual-prototype-r4 >/dev/null
          test -s /tmp/visual-prototype-r4.png

      - name: Commit R4 lifecycle state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/*.json project-state.json reports/visual-prototype-v0.4.pdf
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: register VISUAL_PROTOTYPE R4"
          git pull --rebase origin agent/resolve-visual-prototype-gate
          git push origin HEAD:agent/resolve-visual-prototype-gate
