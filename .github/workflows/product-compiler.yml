name: Product Compiler

on:
  push:
    branches:
      - main
      - agent/resolve-visual-prototype-gate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Product Compiler dependencies
        run: python -m pip install -r requirements-tooling.txt

      - name: Synchronize workspace
        run: python tools/sync_workspace.py --strict-json --verbose

      - name: Verify requirements baseline
        run: python tools/verify_requirements_baseline.py

      - name: Validate visual prototype
        run: python tools/validate_visual_prototype.py --phase VISUAL_PROTOTYPE

      - name: Validate workspace
        run: python tools/validate_workspace.py

      - name: Commit generated Product Compiler state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/*.json project-state.json visual-prototype/prototype-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: sync Product Compiler state"
          git push
